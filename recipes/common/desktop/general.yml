# Configurations and packages for all desktop images.
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - scottames/ghostty
        - ublue-os/packages
        - ublue-os/flatpak-test
      keys:
        - https://repos.fyralabs.com/terra43-mesa/key.asc
    install:
      packages:
        - kitty
        - cryfs
        - ghostty
        - sxiv
        - libpcap-devel
        - libretls
        - vulkan-tools
        - unbound
        - ltrace
        - mpv
        - firewall-config
        - rsms-inter-fonts
        - rsms-inter-vf-fonts
        - fira-code-fonts
        - ibm-plex-fonts-all
        - jetbrains-mono-fonts-all
        - fontawesome-6-free-fonts
        - fontawesome-6-brands-fonts
        - wev
        - ddcutil
        - breeze-cursor-theme
        - breeze-icon-theme
        - zsync
        - uupd
        - fprintd
        - fprintd-pam
        - ublue-polkit-rules
        - python3-pyqt6
        - flatpak-libs
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:ublue-os:flatpak-test # for flatpak preinstall support. remove when flatpak 1.17 comes out
        packages:
          - flatpak
          - flatpak-session-helper

  - type: systemd
    system:
      enabled:
        - flatpak-preinstall.service

  - type: script
    scripts:
      - flatpaks.sh # adds the flathub repo to the image and removes Fedora's poopy flathub repo
